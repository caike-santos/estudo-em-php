<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crie sua conta - Aura Beauty Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-cadastro.css">
</head>
<body>

    <div class="top-bar">
        <a href="index.html" class="btn-voltar">
            <span class="seta">⬅</span> Voltar
        </a>
    </div>

    <main class="cadastro-container">
        <h1>Crie sua conta</h1>
        
        <form id="cadastroForm" class="cadastro-form">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">
            </div>

            <div class="input-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento">
            </div>

            <div class="input-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input-group">
                <label for="senha">Crie uma senha</label>
                <div class="senha-container">
                    <input type="password" id="senha" name="senha" required>
                    <span class="toggle-senha" id="toggleSenha">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnCadastrar">Cadastrar</button>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-grid">
            <div class="footer-col">
                <h4>Nosso Endereço</h4>
                <ul>
                    <li>Rua Exemplo de Estúdio, 123</li>
                    <li>Ipanema, Rio de Janeiro</li>
                    <li>RJ, 00000-000</li>
                </ul>
            </div>
            <div class="footer-col centralizado">
                <h4>Contato</h4>
                <p>(21) 99999-9999</p>
                <p>contato@aurabeauty.com</p>
            </div>
            <div class="footer-col">
                <h4>Redes Sociais</h4>
                <div class="redes-icons">
                    <span class="icon">📷</span> <span class="icon">📘</span>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Aura Beauty Studio. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="script-cadastro.js"></script>
</body>
</html>
